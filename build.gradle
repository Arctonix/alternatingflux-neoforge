plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

version = "${version_minecraft}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    // CurseMaven — used to pull Immersive Engineering as a compile/runtime dependency.
    maven {
        url 'https://cfa2.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // BlameJared maven also hosts IE; kept as a fallback source.
    maven {
        name 'BlameJared'
        url 'https://maven.blamejared.com'
    }
}

// The two gametest run directories, named once because two things read them: the
// runs below, and the check at the bottom of this file that reads the log each run
// wrote. run-gametest-anchored is load-bearing beyond that — see the comment on
// gameTestServerAnchored and StrainSpanFixture.ANCHORED_RUN_DIRECTORY.
def bareRunDirectory = file('run-gametest')
def anchoredRunDirectory = file('run-gametest-anchored')

neoForge {
    version = project.version_neoforge

    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_parchment_mc
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // ./gradlew runGameTestServer -- runs the suite headless and exits
        // non-zero on a failure. Without a standing task the gametests are
        // reachable only by typing /test runall inside a dev run, which means an
        // ordinary `gradlew build` stays green while the behaviour they guard is
        // broken.
        //
        // A BARE install: nothing in the strain-anchor tag, which is what every
        // player who installs only AF and IE has. This run is the guarantee to the
        // five live MC lines that nothing changed.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = bareRunDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // The SAME suite in the only other install shape AF has to work in: with an
        // add-on's dead-ends in the tag. The fixture datapack that puts them there
        // is mounted by StrainSpanFixture and only when this property is set, so it
        // cannot leak into a player's game or into the run above. A datapack is
        // chosen once at server start, so the two installs cannot share one run.
        //
        // The directory name is load-bearing, not cosmetic: it is the only evidence
        // the suite has that this JVM is the anchored run which does NOT come from
        // the property below, and StrainSpanGameTests#runModeMatchesFixture checks
        // the two against each other. A property that silently failed to arrive
        // would otherwise turn every doubling test into a no-op and still report
        // green. Keep it in step with StrainSpanFixture.ANCHORED_RUN_DIRECTORY.
        gameTestServerAnchored {
            type = 'gameTestServer'
            gameDirectory = anchoredRunDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'alternatingflux.gametest.anchors', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Immersive Engineering — the mod we extend. Pulled via CurseMaven.
    // Format: curse.maven:<slug>-<projectId>:<fileId>
    implementation "curse.maven:immersive-engineering-${curse_ie_project}:${curse_ie_file}"
}

// The gametest fixture datapack stands in for an add-on's strain hardware and must
// never reach a player: it names AF's own relay as a dead-end, which is exactly what
// AF promises not to do. It stays in the source tree, where the dev runs read it out
// of build/resources/main, and out of the published artifact.
tasks.named('jar', Jar).configure {
    exclude 'gametest_anchors/**'
}

// ★ A RUN THAT NEVER RAN IS NOT A PASS.
//
// ModDevGradle's run tasks report the game's exit code, and a game that dies during
// MOD LOADING exits ZERO. FML catches the failure, prints "<mod> has failed to load
// correctly", shuts the server down tidily and returns 0; Gradle prints BUILD
// SUCCESSFUL with not one test having run. A FAILING test does exit non-zero, so the
// hole is asymmetric and silent — a broken assertion is red, a dead game is green —
// and that is exactly the wrong way round for what this suite is for.
//
// It is load-bearing here rather than merely untidy. The strain-span rule is a mixin
// into a method body inside a mod we do not control, deliberately set to fail SOFT
// (require = 0 on every handler — see WireCoilItemMixin), which means an Immersive
// Engineering that moves that method takes the feature away without a word in the
// log. This suite is the ONLY thing that would ever say so. It must not also be the
// thing that says nothing when the game will not start at all — and the near miss is
// concrete rather than hypothetical: putting require back to 1 is a one-character
// change that kills the game at load, and before this check it was a green build.
//
// So each run is made to prove it ran, out of the log it wrote:
//   - the log has to exist, and to be THIS run's — it is deleted beforehand, so last
//     run's success cannot be mistaken for this one's;
//   - it has to carry vanilla's own "All N required tests passed" summary; and
//   - N has to be the number of @GameTest methods in the suite, so a run that
//     started, loaded, and then registered none of them is not a pass either.

/**
 * The suite's own size, read off the source rather than written down in a second
 * place to drift. Both installs run every test — the ones that are about the other
 * install hand themselves in — so both runs must report this number.
 */
def gameTestSources = file('src/main/java/antibluequirk/alternatingflux/gametest')
int declaredGameTests = 0
gameTestSources.eachFileRecurse { File f ->
    if(f.name.endsWith('.java'))
        f.eachLine('UTF-8') { String line -> if(line ==~ /\s*@GameTest\s*\(.*/) declaredGameTests++ }
}

def proveItRan = { String taskName, File gameDirectory ->
    File log = new File(gameDirectory, 'logs/latest.log')
    tasks.named(taskName).configure {
        // A run task declares no outputs, so Gradle already always executes it; said
        // out loud because everything below is worthless if the task is ever skipped.
        outputs.upToDateWhen { false }
        // Last run's log is not evidence about this one.
        doFirst { log.delete() }
        doLast {
            if(!log.isFile())
                throw new GradleException("$taskName wrote no log at $log, so it cannot have run"
                        + " the gametest suite. Gradle reports a game that died during mod loading"
                        + " as a SUCCESS; the task output above is why it never started.")

            String text = log.getText('UTF-8')
            def summary = text =~ /All (\d+) required tests passed/
            if(!summary.find())
            {
                String loadFailure = log.readLines().find { it.contains('has failed to load correctly') }
                throw new GradleException("$taskName finished without running the gametest suite:"
                        + " nothing in $log says \"All N required tests passed\"."
                        + (loadFailure!=null
                                ? "\nThe game failed to load:\n  "+loadFailure.trim()
                                : "\nThe game printed no test summary at all; read $log.")
                        + "\nThat exits 0 on its own and would otherwise have been a green build.")
            }

            int ran = summary.group(1) as int
            if(ran!=declaredGameTests)
                throw new GradleException("$taskName ran $ran gametests but $gameTestSources declares"
                        + " $declaredGameTests. Every test runs in both installs, so a run short of"
                        + " tests has skipped some of them silently."
                        + "\n(That number follows the source: it is the count of @GameTest methods"
                        + " there. A mismatch means the game did not see what is written.)")

            logger.lifecycle("$taskName: all $ran gametests passed.")
        }
    }
}
proveItRan('runGameTestServer', bareRunDirectory)
proveItRan('runGameTestServerAnchored', anchoredRunDirectory)

// Both installs, in one command. The suite is not "passed" until both are.
tasks.register('gameTest') {
    group = 'verification'
    description = 'Runs the gametest suite in both installs: bare AF, and AF with the strain-anchor fixture datapack.'
    dependsOn 'runGameTestServer', 'runGameTestServerAnchored'
}
tasks.named('runGameTestServerAnchored').configure { mustRunAfter 'runGameTestServer' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id        : mod_id,
            mod_version   : mod_version,
            mod_name      : mod_name,
            version_minecraft: version_minecraft,
            version_neoforge : version_neoforge,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
