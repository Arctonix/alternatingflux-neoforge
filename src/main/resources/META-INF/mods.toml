modLoader = "javafml"
loaderVersion = "[36,)"
license = "Custom — see LICENSE file"
issueTrackerURL = "https://github.com/Arctonix/alternatingflux-neoforge/issues"
updateJSONURL = "https://raw.githubusercontent.com/Arctonix/alternatingflux-neoforge/1.16.5-forge-stable/update.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Arctonix/alternatingflux-neoforge"
authors = "AntiBlueQuirk (original), Arctonix (port)"
description = '''
Adds Alternating Flux (AF), a long-distance super-high-voltage wire tier for
Immersive Engineering. Very low loss over distance; cannot power machines
directly — step down to HV through an AF Transformer (HV<->AF, 1:1). Ported to
1.16.5 / Forge at feature parity with the 1.21.1 / NeoForge v1.0.5 release.
'''

# Hard dependency on Immersive Engineering 5.1.x (1.16.5 branch), floored at 5.1
# which introduced the public EnergyConnectorTileEntity two-arg constructor and
# the NAME_TO_SPEC/SPEC_TO_TYPE maps (built against 5.1.0-148).
[[dependencies.${mod_id}]]
modId = "immersiveengineering"
mandatory = true
versionRange = "[1.16.5-5.1,)"
ordering = "AFTER"
side = "BOTH"

# Forge (1.16.5 / 36.x line).
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[36,37)"
ordering = "NONE"
side = "BOTH"

# Minecraft.
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.16.5,1.17)"
ordering = "NONE"
side = "BOTH"
