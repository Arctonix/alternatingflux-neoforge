modLoader = "javafml"
loaderVersion = "[40,)"
license = "Custom — see LICENSE file"
issueTrackerURL = "https://github.com/Arctonix/alternatingflux-neoforge/issues"
displayURL = "https://github.com/Arctonix/alternatingflux-neoforge"
updateJSONURL = "https://raw.githubusercontent.com/Arctonix/alternatingflux-neoforge/master/update.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "AntiBlueQuirk (original), Arctonix (port)"
description = '''
Adds Alternating Flux (AF), a long-distance super-high-voltage wire tier for
Immersive Engineering. Very low loss over distance; cannot power machines directly
— step down through an AF Transformer (HV<->AF). Ported to 1.18.2 / Forge.
'''

# Hard dependency on Immersive Engineering, floored at the pinned 8.4 line.
[[dependencies.${mod_id}]]
modId = "immersiveengineering"
mandatory = true
versionRange = "[1.18.2-8.4,)"
ordering = "AFTER"
side = "BOTH"

# Forge — the 1.18.2 line.
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[40,41)"
ordering = "NONE"
side = "BOTH"

# Minecraft 1.18.2.
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.18.2,1.19)"
ordering = "NONE"
side = "BOTH"
