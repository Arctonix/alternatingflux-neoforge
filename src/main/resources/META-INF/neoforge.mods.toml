modLoader = "javafml"
loaderVersion = "[4,)"
license = "Custom — see LICENSE file"
issueTrackerURL = "https://github.com/Arctonix/alternatingflux-neoforge/issues"

# The strain-span rule, applied inside Immersive Engineering's own coil-use path so
# that it reaches every coil in the game rather than only the two AF registers.
# The config is deliberately NOT required and its handlers are all require = 0: if a
# future IE moves the method this is pinned to, Mixin logs a warning and drops the
# mixin instead of killing the game. See WireCoilItemMixin.
[[mixins]]
config = "alternatingflux.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Arctonix/alternatingflux-neoforge"
updateJSONURL = "https://raw.githubusercontent.com/Arctonix/alternatingflux-neoforge/master/update.json"
authors = "AntiBlueQuirk (original), Arctonix (1.21.1 port)"
description = '''
Adds Alternating Flux (AF), a long-distance super-high-voltage wire tier for
Immersive Engineering. Very low loss over distance; cannot power machines
directly — step down to HV through an AF Transformer. Ported to 1.21.1 / NeoForge.
'''

# Hard dependency on Immersive Engineering.
[[dependencies.${mod_id}]]
modId = "immersiveengineering"
type = "required"
versionRange = "[12.1,)"
ordering = "AFTER"
side = "BOTH"

# NeoForge.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,21.2)"
ordering = "NONE"
side = "BOTH"

# Minecraft.
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"
